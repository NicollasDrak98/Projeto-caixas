<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo CSS</title>
    <style>
     p{
     margin: 100px;
     font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
     font-size: 120px;
color: #f30000;
}
      #Titulo-diferente{
        color: blue;
       
        font-size: 60px;
      }
      #titulo-novel{
        color: #4300fc;
        font-size: 30px;
      }
      .padrao{
        color: #0f2e1f;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 15px;
      }
    </style>
</head>
<body>
    <p>nicollas</p>
    <p id="Titulo-diferente">Carvalho</p>
    <p id="titulo-novel">Silva</p>
    <p class="padrao">Cardoso</p>
    <p class="padrao">neymar</p>
    <p class="padrao">junior</p>
</body>
</html>
